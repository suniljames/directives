# Agent Types, Providers & Assignments
#
# Single source of truth for:
#   - Abstract agent types (builder, validator, etc.)
#   - LLM providers and their capabilities
#   - Default provider-to-agent-type assignments
#
# Orchestrators read this file to route work to the right provider.
# Projects can override assignments in their CONTRIBUTING.md.

agent_types:
  - id: builder
    description: "Creates work — implements, produces, deploys"
    capabilities:
      - create_deliverables
      - verify_quality
      - publish
      - integrate

  - id: validator
    description: "Reviews work — audits, checks quality, flags issues"
    capabilities:
      - review_work
      - write_specifications
      - file_findings

providers:
  - id: claude-code
    name: Claude Code
    binary: claude
    strengths:
      - content_creation
      - iterative_refinement
      - tool_use
      - delivery

  - id: antigravity-cli
    name: Antigravity CLI
    binary: agy
    strengths:
      - analysis
      - review
      - specification
      - documentation

# Default: which provider backs each agent type.
# Orchestrators use this unless the project overrides.
#
# fallback_order: if the preferred provider is unavailable, use the next one.
# "Unavailable" is not just a missing binary — it includes rate-limiting
# (HTTP 429) and credit/quota exhaustion. When one provider becomes unavailable,
# the other assumes the open role (bidirectional role swap): the builder provider
# can act as validator when the validator provider is rate-limited, and vice
# versa. See framework/agent-architecture.md → "Role Swap on Provider
# Unavailability".
#
# Every id in fallback_order must be defined under `providers:` above.
assignments:
  default:
    builder: claude-code
    validator: antigravity-cli
  fallback_order:
    builder:
      - claude-code
      - antigravity-cli
    validator:
      - antigravity-cli
      - claude-code

# Model selection is intentionally NOT pinned here.
#   - Builder model: whatever the active CLI session is configured to use, set
#     natively in that CLI (example: Claude Code `/model`). Whoever you launch
#     is the builder, so its model is already chosen by how you start it.
#   - Validator model: designated per session by the builder when it invokes the
#     validator bridge, so it can be a smaller/cheaper read-only model — an env
#     var read by the project's validator wrapper, or the model flag of the
#     review session the builder spawns (example: `claude -p --model <model>`).
# Pinning concrete values here would drift from the CLIs that actually own them.
# Per-provider specifics live in providers/<provider>/.
